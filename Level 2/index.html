<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Bag</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <button class="shop" id="bag" onclick="alert('added to cart'); cartItems++; document.querySelector('#cart-summary').innerText = `Your Cart (${cartItems} items)`;" >Add to Bag</button>
    <button class="shop" id="wish" onclick="if (cartItems > 0) {alert('added to wishlist'); cartItems--; document.querySelector('#cart-summary').innerText = `Your Cart (${cartItems} items)`;} else {alert('Your cart is empty');}" >MOVE TO WISHLIST</button>
    <button class="shop" id="sale" onclick="alert('added to cart'); cartItems+=2; document.querySelector('#cart-summary').innerText = `Your Cart (${cartItems} items)`;" >Add 1+1 sale item</button>
    <h1 id="cart-summary"></h1>
    <script>
        let cartItems = 0;
document.querySelector("#cart-summary").innerText = `Your Cart (${cartItems} items)`;
    </script> 
</body>
</html>
