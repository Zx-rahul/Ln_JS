<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>Calculator</title>
</head>
<body>
    <div id="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons-container">
        <div class="row1">
            <button class="operators" id="clear"
             onclick="
            currentDisplay = '';
            document.querySelector('#display').value = currentDisplay;">AC</button>
            <button class="numbers" id="one"
            onclick="
            currentDisplay =currentDisplay + '1';
            document.querySelector('#display').value = currentDisplay;"
            >1</button>
            <button class="numbers" id="two"
            onclick="
            currentDisplay =currentDisplay + '2';
            document.querySelector('#display').value = currentDisplay;"
            >2</button>
            
        </div>
        <div class="row2">  
            <button class="operators" id="add"
            onclick="
            currentDisplay =currentDisplay + '+';
            document.querySelector('#display').value = currentDisplay;"
            >+</button>
            <button class="numbers" id="three"
            onclick="
            currentDisplay =currentDisplay + '3';
            document.querySelector('#display').value = currentDisplay;"
            >3</button>
            <button class="numbers" id="four"
            onclick="
            currentDisplay =currentDisplay + '4';
            document.querySelector('#display').value = currentDisplay;"
            >4</button>
        </div>
        <div class="row3">
            <button class="operators" id="subtract"
            onclick="
            currentDisplay =currentDisplay + '-';
            document.querySelector('#display').value = currentDisplay;"
            >-</button>
            <button class="numbers" id="five"
            onclick="
            currentDisplay =currentDisplay + '5';
            document.querySelector('#display').value = currentDisplay;"
            >5</button>
            <button class="numbers" id="six"
            onclick="
            currentDisplay =currentDisplay + '6';
            document.querySelector('#display').value = currentDisplay;"
            >6</button>
        </div>
        <div class="row4">
            <button class="operators" id="multiply"
            onclick="
            currentDisplay =currentDisplay + '*';
            document.querySelector('#display').value = currentDisplay;"
            >*</button>
            <button class="numbers" id="seven"
            onclick="
            currentDisplay =currentDisplay + '7';
            document.querySelector('#display').value = currentDisplay;"
            >7</button>
            <button class="numbers" id="eight"
            onclick="
            currentDisplay =currentDisplay + '8';
            document.querySelector('#display').value = currentDisplay;"
            >8</button>
        </div>
        <div class="row5">
            <button class="operators" id="divide"
            onclick="
            currentDisplay =currentDisplay + '/';
            document.querySelector('#display').value = currentDisplay;"
            >/</button>
            <button class="numbers" id="nine"
            onclick="
            currentDisplay =currentDisplay + '9';
            document.querySelector('#display').value = currentDisplay;"
            >9</button>
            <button class="numbers" id="zero"
            onclick="
            currentDisplay =currentDisplay + '0';
            document.querySelector('#display').value = currentDisplay;"
            >0</button>
        </div>
        <div class="lastrow">
        <button class="operators" id="equals" 
        onclick="currentDisplay=eval(currentDisplay);
        document.querySelector('#display').value =currentDisplay;
        
        "
        
        
        >=</button>
        <button class="numbers" id="decimal"
        onclick="
        currentDisplay =currentDisplay + '.';
        document.querySelector('#display').value = currentDisplay;"
        >.</button>
        </div>
        </div>
    </div>
    
    <script>
        let currentDisplay = '';
        document.querySelector('#display').value = currentDisplay;
    </script>
</body>
</html>
