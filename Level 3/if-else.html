    <script>
     let age = 20;
     let gender = 'male';
     discount = '0%';
     if(age < 5){
      discount = '100%';
     }else if(age <= 8 || gender === 'female'){
      discount = '50%';
     }else if(age >= 65){
      discount = '30%';
     }
        console.log(`You get a discount of ${discount}`);
    </script>
